<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALO ASKA – Bibliothèque</title>
<meta name="description" content="ALO ASKA, Amicales des Livres Ouverts : gestion de la bibliothèque">
<meta name="theme-color" content="#0F3350">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap">
<style>
:root{
  --bg:#F3F6FB;--panel:#fff;--ink:#0F2E48;--muted:#5A6A80;--line:#DCE4F0;
  --blue:#187AB0;--blue-ink:#fff;--side:#0F3350;--sun:#F08A1C;
  --ok:#17743F;--okbg:#DDF4E6;--warn:#8A5A00;--warnbg:#FCEBC8;--bad:#A7322B;--badbg:#FBE3E1;
  --display:"Bricolage Grotesque","Trebuchet MS",Arial,sans-serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08121F;--panel:#0F2036;--ink:#E8EFFA;--muted:#9BAEC7;--line:#20344D;
  --blue:#5CBCEB;--blue-ink:#08121F;--side:#0A1A2E;
  --ok:#7BE0A4;--okbg:#12382A;--warn:#F5C766;--warnbg:#3A2C0C;--bad:#FF9C94;--badbg:#3E1C1A;
}}
:root[data-theme="dark"]{
  --bg:#08121F;--panel:#0F2036;--ink:#E8EFFA;--muted:#9BAEC7;--line:#20344D;
  --blue:#5CBCEB;--blue-ink:#08121F;--side:#0A1A2E;
  --ok:#7BE0A4;--okbg:#12382A;--warn:#F5C766;--warnbg:#3A2C0C;--bad:#FF9C94;--badbg:#3E1C1A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--ui)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15}

.shell{display:flex;min-height:100vh}
.side{width:236px;flex:0 0 auto;background:var(--side);color:#E8EFFA;padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{padding:0 0 18px;display:grid;gap:10px}
.brand img{width:100%;height:auto;background:#fff;border-radius:12px;display:block}
.brand b{font:800 15px var(--display);letter-spacing:.02em;padding:0 4px}
.tabLogo{display:none}
.side button{background:none;border:0;color:#C9D8EE;text-align:left;padding:12px 14px;border-radius:9px;cursor:pointer;font-weight:500}
.side button:hover{background:#ffffff14}
.side button[aria-current="page"]{background:var(--blue);color:#fff}
.side .devise{margin:auto 4px 0;padding-left:12px;border-left:3px solid var(--sun);font:italic 15px/1.4 Georgia,serif;color:#E8EFFA}
.side .devise span{display:block;font:500 12px var(--display);font-style:normal;color:#9FB4D0;margin-top:4px}
.side .mode{margin-top:18px;font-size:13px;color:#9FB4D0;padding:0 10px}

main{flex:1;min-width:0;padding:28px 28px 40px;max-width:1100px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.head h1{font-size:clamp(26px,4vw,34px);font-weight:800}
.head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.sub{color:var(--sun)!important;font-weight:600}
.tools{display:flex;gap:8px;flex-wrap:wrap}

.btn{background:var(--blue);color:var(--blue-ink);border:0;border-radius:9px;padding:11px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.08)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:10px;padding:14px 16px;display:grid}
.tile b{font:800 34px/1.1 var(--display)}
.tile span{color:var(--muted);font-size:14px}
.tile.ok{border-left-color:#22A45D}.tile.warn{border-left-color:var(--sun)}.tile.bad{border-left-color:#D9453D}

.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.panel h2{font-size:19px;margin-bottom:10px}
.wide{margin-top:16px}

.row{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:13px 0;border-bottom:1px solid var(--line);align-items:center}
.row:last-child{border-bottom:0}
.row h3{font:700 16px var(--display)}
.row small{color:var(--muted);font-size:13.5px;display:block}
.row .main{min-width:0}
.acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.acts button{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
.acts button:hover{border-color:var(--blue)}
.acts .danger{color:var(--bad)}
.pill{font:600 13px var(--display);padding:4px 11px;border-radius:99px;white-space:nowrap;background:var(--line);color:var(--muted)}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.no{background:var(--badbg);color:var(--bad)}
.empty{color:var(--muted);padding:18px 0;margin:0}

.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 14px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}

.cat{padding:9px 0}
.cat div{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.track{height:9px;border-radius:9px;background:var(--okbg);overflow:hidden}
.track i{display:block;height:100%;background:var(--sun)}

.devLine{margin:26px 0 0;padding-left:14px;border-left:4px solid var(--sun);font:italic 18px/1.4 Georgia,serif}
.devLine span{display:block;font:500 13px var(--display);font-style:normal;color:var(--muted);margin-top:4px}
.first{text-align:center;padding:40px 12px}
.first h2{font-size:24px;margin-bottom:8px}
.first p{color:var(--muted);max-width:44ch;margin:0 auto 18px}
.first .tools{justify-content:center}

/* fenêtres */
dialog{border:0;border-radius:14px;padding:0;width:min(440px,calc(100vw - 28px));background:var(--panel);color:var(--ink);box-shadow:0 20px 60px #0007}
dialog::backdrop{background:#0B254588}
dialog form{padding:22px;display:grid;gap:14px}
dialog h2{font-size:22px}
dialog label{display:grid;gap:5px;font-size:14px;font-weight:600}
dialog input,dialog select{padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);width:100%;font-weight:400}
dialog .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.err{color:var(--bad);margin:0;font-size:14px;min-height:0}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1}

/* accueil */
.hero{padding:6px 0 4px}
.big{font:800 clamp(34px,7vw,60px)/1.02 var(--display);letter-spacing:-.02em;max-width:14ch}
.tag{color:var(--muted);font-size:18px;max-width:36ch;margin:14px 0 0}
.devHero{margin:22px 0 0;padding:4px 0 4px 16px;border-left:4px solid var(--sun);font:italic 400 21px/1.4 Georgia,serif;max-width:28ch}
.devHero cite{display:block;font:500 14px var(--display);color:var(--muted);font-style:normal;margin-top:6px}
.state{display:inline-flex;align-items:center;gap:8px;margin-top:20px;font:500 15px var(--display);padding:7px 14px;border-radius:99px;background:var(--panel);border:1px solid var(--line)}
.state b{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.state.open b{background:#22A45D}
.shelf{display:flex;align-items:flex-end;gap:5px;overflow-x:auto;padding:22px 4px 0;scrollbar-width:thin}
.spine{flex:0 0 auto;border:0;padding:12px 0;border-radius:3px 3px 0 0;color:#fff;cursor:pointer;writing-mode:vertical-rl;font:600 14px var(--display);transition:transform .18s ease;box-shadow:inset -4px 0 0 #0002}
.spine:hover{transform:translateY(-8px)}
.spine[aria-pressed="true"]{transform:translateY(-16px);outline:3px solid var(--sun);outline-offset:1px}
.board{height:12px;background:var(--ink);border-radius:2px}
.detail{padding:16px 4px 0;display:grid;gap:2px}
.detail h3{font:800 24px var(--display)}
.detail p{margin:0;color:var(--muted)}
table.hours{border-collapse:collapse;width:100%}
table.hours td{padding:9px 0;border-bottom:1px solid var(--line)}
table.hours td:last-child{text-align:right}
table.hours tr.today td{font-weight:700;color:var(--blue)}
.info p{margin:0 0 8px}
.info a{color:var(--blue)}
.scan{display:grid;gap:8px;padding:12px;border:1px dashed var(--line);border-radius:10px}
.scan .hint{margin:0;color:var(--muted);font-size:13.5px}
.sum{margin:6px 0 0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.sum.open{display:block}
.detail .sumFull{color:var(--ink);margin-top:10px;max-width:62ch}
dialog{max-height:calc(100vh - 28px);overflow:auto}
dialog textarea{padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);width:100%;font:inherit;font-weight:400;resize:vertical}
#reader{width:100%;border-radius:10px;overflow:hidden}
.isbnRow{display:grid;grid-template-columns:1fr auto;gap:8px}
.mobLogo{display:none}
/* connexion */
#gate{display:none;min-height:100vh;place-items:center;padding:24px;background:var(--bg)}
body[data-state="gate"] #gate{display:grid}
body[data-state="gate"] .shell,body[data-state="gate"] .tabs{display:none!important}
.gateCard{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;display:grid;gap:14px}
.gateCard img{width:100%;max-width:300px;height:auto;background:#fff;border-radius:12px;margin:0 auto;display:block}
.gateCard h1{font-size:26px;text-align:center}
.gateCard p{margin:0;color:var(--muted);text-align:center}
.gateCard form{display:grid;gap:14px}
.gateCard label{display:grid;gap:5px;font-size:14px;font-weight:600}
.gateCard input{padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);width:100%;font-weight:400}
.gateCard .link{background:none;border:0;color:var(--blue);cursor:pointer;font-size:15px;padding:6px;text-decoration:underline}
.gateCard .err{color:var(--bad);min-height:0;margin:0;font-size:14px;text-align:center}
.gateCard .ok{color:var(--ok)}
.gateCard .dv{font:italic 15px/1.4 Georgia,serif;border-left:4px solid var(--sun);padding-left:12px;text-align:left;color:var(--ink)}
.tabs{display:none}
@media (max-width:820px){
  .side{display:none}
  main{padding:18px 16px 96px}
  .tiles{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabs button{flex:1;background:none;border:0;padding:14px 4px;font:600 13px var(--display);color:var(--muted);cursor:pointer}
  .tabs button[aria-current="page"]{color:var(--blue);box-shadow:inset 0 3px 0 var(--blue)}
  .modeTop{display:block!important}
  .mobLogo{display:block;height:64px;width:auto;background:#fff;border-radius:10px;margin-bottom:12px}
}
.modeTop{display:none;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function today(){return iso(new Date())}

function rowToObj(r){var o=Object.assign({},r.data||{});o.id=r.id;return o}
function objToRow(o){var d=Object.assign({},o);delete d.id;return {id:o.id,data:d}}
function put(c,obj){
  var i=S[c].findIndex(function(x){return x.id===obj.id});

}
function del(c,id){
  S[c]=S[c].filter(function(x){return x.id!==id});
  render();
  sb.from(TABLE[c]).delete().eq("id",id).then(function(r){if(r.error){fail(r.error);loadAll()}});
}
function loadAll(){
  var jobs=[sb.from("books").select("id,data"),sb.from("adherents").select("id,data"),sb.from("loans").select("id,data"),sb.from("settings").select("id,data").eq("id","info"),sb.from("profiles").select("*").order("created_at")];
  return Promise.all(jobs).then(function(rs){

function isLate(l){return !l.returned&&l.due<today()}
function bookOf(id){return S.books.find(function(b){return b.id===id})}
function memberOf(id){return S.members.find(function(m){return m.id===id})}
function nextCode(prefix,list,field){var m=0;list.forEach(function(x){var n=parseInt(String(x[field]).replace(/\D/g,""),10);if(n>m)m=n});return prefix+String(m+1).padStart(4,"0")}
function categories(){var c=[];S.books.forEach(function(b){if(c.indexOf(b.category)<0)c.push(b.category)});return c.sort()}

function render(){
  $("title").textContent=TITLES[view];
  document.querySelectorAll("[data-view]").forEach(function(b){
    b.setAttribute("aria-current",b.dataset.view===view?"page":"false");
    if(b.dataset.view==="team")b.textContent="Membres"+(requests.length?" ("+requests.length+")":"");
  });
  $("mode").textContent=modeText();$("modeTop").textContent=modeText();
  var tools="";
  if(ready&&canWrite){
    if(view==="dash")tools='<button class="btn ghost" data-a="backup">Sauvegarder</button>';
    if(view==="books")tools=(canScan()?'<button class="btn" data-a="scanBook">Scanner un livre</button>':'')+'<button class="btn ghost" data-a="addBook">Ajouter à la main</button><button class="btn ghost" data-a="export">Exporter (CSV)</button>';
    if(view==="members")tools='<button class="btn" data-a="addMember">Ajouter un adhérent</button>';
    if(view==="loans")tools='<button class="btn" data-a="addLoan">Nouvel emprunt</button>';
  }
  if(session)tools+='<button class="btn ghost" data-a="logout">Se déconnecter</button>';
  $("headTools").innerHTML=tools;
  var v=$("view");
  if(!ready){v.innerHTML='<p class="empty">Chargement…</p>';return}
  v.innerHTML=({home:vHome,dash:vDash,books:vBooks,members:vMembers,loans:vLoans,team:vTeam})[view]();
}

var COLORS=["#187AB0","#C25E00","#0F3350","#5F6B78","#1F6F9E","#8F4A00"];
var JOURS=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
/* Horaires : dimanche en premier. Plages [ouverture, fermeture] en heures (11.5 = 11 h 30), null = fermé. Ouvert du samedi au jeudi. */
var HOURS=[[[7,11.5],[16.5,18]],[[7,11.5],[16.5,18]],[[7,11.5],[16.5,18]],[[7,11.5],[16.5,18]],[[7,11.5],[16.5,18]],null,[[7,11.5],[16.5,18]]];
function hm(t){var h=Math.floor(t),m=Math.round((t-h)*60);return h+" h"+(m?" "+(m<10?"0":"")+m:"")}
function slots(x){return x.map(function(r){return hm(r[0])+" à "+hm(r[1])}).join(" et ")}
function openState(){
  var now=new Date(),tx=HOURS[now.getDay()]||[],hr=now.getHours()+now.getMinutes()/60;
  for(var i=0;i<tx.length;i++){
    if(hr>=tx[i][0]&&hr<tx[i][1])return {open:true,txt:"Ouvert maintenant, jusqu'à "+hm(tx[i][1])};
    if(hr<tx[i][0])return {open:false,txt:"Fermé, ouvre à "+hm(tx[i][0])};
  }
  return {open:false,txt:"Fermé pour le moment"};
}

function vDash(){
  if(!S.books.length&&!S.members.length){
    return '<div class="panel first"><h2>Votre bibliothèque est vide</h2><p>Enregistrez d\'abord vos livres et vos adhérents. Le tableau de bord affichera ensuite le nombre de livres présents et empruntés.</p>'+
      (canWrite?'<div class="tools">'+(canScan()?'<button class="btn" data-a="scanBook">Scanner un livre</button>':'')+'<button class="btn ghost" data-a="addBook">Ajouter un livre</button><button class="btn ghost" data-a="addMember">Ajouter un adhérent</button></div>':'')+'</div>';
  }
  var total=0,avail=0;S.books.forEach(function(b){total+=b.copies;avail+=availOf(b)});
  var out=total-avail,act=activeLoans(),late=act.filter(isLate).length;
  var tiles=[["Titres",S.books.length,""],["Exemplaires",total,""],["Disponibles",avail,"ok"],["Empruntés",out,"warn"],["En retard",late,late?"bad":""],["Adhérents",S.members.length,""]];
  var h='<div class="tiles">'+tiles.map(function(t){return '<div class="tile '+t[2]+'"><b>'+t[1]+'</b><span>'+t[0]+'</span></div>'}).join("")+'</div>';
  var due=act.slice().sort(function(a,b){return a.due<b.due?-1:1}).slice(0,6);
  var recent=S.books.slice().sort(function(a,b){return (b.added||"")<(a.added||"")?-1:1}).slice(0,5);
  h+='<div class="grid2"><div class="panel"><h2>Prochains retours</h2>'+(due.length?due.map(function(l){
    var b=bookOf(l.bookId),m=memberOf(l.memberId);
    return '<div class="row"><div class="main"><h3>'+esc(b?b.title:"Livre supprimé")+'</h3><small>'+esc(m?m.name:"Adhérent supprimé")+', à rendre le '+fd(l.due)+'</small></div><span class="pill '+(isLate(l)?"no":"")+'">'+(isLate(l)?"En retard":"En cours")+'</span></div>';
  }).join(""):'<p class="empty">Aucun livre n\'est sorti en ce moment.</p>')+'</div>';
  h+='<div class="panel"><h2>Derniers livres ajoutés</h2>'+(recent.length?recent.map(function(b){
    return '<div class="row"><div class="main"><h3>'+esc(b.title)+'</h3><small>'+esc(b.author)+'</small></div><span class="pill">'+esc(b.category)+'</span></div>';
  }).join(""):'<p class="empty">Aucun livre enregistré.</p>')+'</div></div>';
  var cs=categories();
  if(cs.length){
    h+='<div class="panel wide"><h2>Par catégorie</h2>'+cs.map(function(c){
      var t=0,o=0;S.books.forEach(function(b){if(b.category===c){t+=b.copies;o+=outOf(b.id)}});
      return '<div class="cat"><div><span>'+esc(c)+'</span><span>'+o+' empruntés sur '+t+'</span></div><span class="track" style="display:block"><i style="width:'+(t?Math.min(100,Math.round(o/t*100)):0)+'%"></i></span></div>';
    }).join("")+'</div>';
  }
  return h;
}

  var r=S.books.filter(function(b){return (cat==="Tous"||b.category===cat)&&[b.code,b.title,b.author,b.category].join(" ").toLowerCase().indexOf(s)>-1})
    .sort(function(a,b){return a.title.localeCompare(b.title,"fr")});
  if(!r.length)return '<p class="empty">'+(S.books.length?"Aucun livre ne correspond à cette recherche.":"Aucun livre enregistré pour l'instant.")+'</p>';
  return r.map(function(b){

  var s=mq.trim().toLowerCase();
  var r=S.members.filter(function(m){return [m.num,m.name,m.phone].join(" ").toLowerCase().indexOf(s)>-1});
  if(!r.length)return '<p class="empty">Aucun adhérent ne correspond à cette recherche.</p>';
  return r.sort(function(a,b){return a.name.localeCompare(b.name,"fr")}).map(function(m){
    var n=activeLoans().filter(function(l){return l.memberId===m.id}).length;

function vLoans(){
  var F=[["cours","En cours"],["retard","En retard"],["rendus","Retournés"],["tous","Tous"]];
  var r=S.loans.filter(function(l){return lf==="tous"||(lf==="cours"&&!l.returned)||(lf==="retard"&&isLate(l))||(lf==="rendus"&&l.returned)})
    .sort(function(a,b){return (b.out||"")<(a.out||"")?-1:1});
  var h='<div class="panel"><div class="chips">'+F.map(function(f){return '<button class="chip" data-a="lf" data-id="'+f[0]+'" aria-pressed="'+(f[0]===lf)+'">'+f[1]+'</button>'}).join("")+'</div>';
  if(!r.length)return h+'<p class="empty">Aucun emprunt dans cette liste.</p></div>';
  return h+r.map(function(l){
    var b=bookOf(l.bookId),m=memberOf(l.memberId),late=isLate(l);
    var days=late?Math.round((new Date(today())-new Date(l.due))/864e5):0;

      (!l.returned&&canWrite?'<div class="acts"><button data-a="return" data-id="'+esc(l.id)+'">Marquer comme rendu</button></div>':'')+'</article>';
  }).join("")+'</div>';

function scanHtml(){

    h+='<button type="button" class="btn ghost" data-a="scan">Photographier la couverture ou la quatrième</button><input type="file" id="cover" accept="image/*" capture="environment" hidden>';

function scanMsg(t){var m=$("scanmsg");if(m)m.textContent=t}
function bookForm(){return (dlg.open&&dlg.dataset.kind==="book")?dlg.querySelector("form"):null}
function applyInfo(info){
  var f=bookForm();if(!f)return false;
  if(info.title)f.elements.title.value=info.title;
  if(info.author)f.elements.author.value=info.author;
  if(info.category)f.elements.category.value=info.category;
  if(info.summary)f.elements.summary.value=info.summary;
  if(info.isbn&&f.elements.isbn&&!f.elements.isbn.value)f.elements.isbn.value=info.isbn;
  return true;
}
/* ----- code-barres (ISBN) ----- */
function stopReader(){
  var q=qr;qr=null;
  if(q){q.stop().then(function(){try{q.clear()}catch(e){}}).catch(function(){})}
  var r=$("reader");if(r)r.style.display="none";
}
function startReader(){
  if(qr){stopReader();return}
  if(!window.Html5Qrcode)return scanMsg("Le lecteur de code-barres n'a pas pu se charger. Saisissez l'ISBN à la main.");
  var box=$("reader");if(!box)return;box.style.display="block";
  try{
    qr=new Html5Qrcode("reader",{formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A],verbose:false});
  }catch(e){qr=null;box.style.display="none";return scanMsg("Le lecteur n'est pas disponible. Saisissez l'ISBN à la main.")}
  scanMsg("Placez le code-barres dans le cadre.");
  qr.start({facingMode:"environment"},{fps:10,qrbox:{width:260,height:110}},function(text){stopReader();lookupIsbn(text)},function(){})
    .catch(function(){qr=null;box.style.display="none";scanMsg("Impossible d'ouvrir la caméra. Autorisez-la dans le navigateur, ou saisissez l'ISBN.")});
}
function getJson(url){return fetch(url).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
function mapCat(list){
  var t=(list||[]).join(" ").toLowerCase(),nf=t.replace(/non-?fiction/g,"");
  if(/juvenile|children|enfant|jeunesse/.test(t))return "Jeunesse";
  if(/poetry|poésie|poesie|poem/.test(t))return "Poésie";
  if(/relig|spirit|islam|bible|christian|coran/.test(t))return "Religion";
  if(/fiction|novel|roman|literar|stories/.test(nf))return "Roman";
  if(/histor|biograph|politic|geograph/.test(t))return "Histoire";
  if(/scien|technolog|mathem|comput|nature|medic|health|engineer/.test(t))return "Sciences";
  return list&&list[0]?list[0]:"Autres";
}
function plainText(html){try{return (new DOMParser().parseFromString(String(html||""),"text/html").body.textContent||"").replace(/\s+/g," ").trim()}catch(e){return String(html||"")}}
function googleLookup(isbn){
  return getJson("https://www.googleapis.com/books/v1/volumes?q=isbn:"+isbn+"&maxResults=1").then(function(r){
    var it=r&&r.items&&r.items[0];if(!it)return null;var v=it.volumeInfo||{};
    return {title:(v.title||"")+(v.subtitle?" : "+v.subtitle:""),author:(v.authors||[]).join(", "),category:mapCat(v.v.6
